<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16162a"/>
      <stop offset="100%" style="stop-color:#252540"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9f67ff"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <!-- Sword icon -->
  <g transform="translate(256,256)">
    <!-- Blade -->
    <rect x="-14" y="-180" width="28" height="240" rx="6" fill="url(#accent-grad)"/>
    <!-- Crossguard -->
    <rect x="-70" y="50" width="140" height="28" rx="8" fill="#9f67ff"/>
    <!-- Handle -->
    <rect x="-10" y="78" width="20" height="80" rx="5" fill="#7c3aed"/>
    <!-- Pommel -->
    <circle cx="0" cy="172" r="18" fill="#9f67ff"/>
    <!-- Tip shine -->
    <polygon points="0,-200 -6,-170 6,-170" fill="#ffffff" opacity="0.6"/>
  </g>
  <!-- Stars decoration -->
  <circle cx="100" cy="100" r="4" fill="#f59e0b" opacity="0.8"/>
  <circle cx="412" cy="140" r="3" fill="#9f67ff" opacity="0.6"/>
  <circle cx="80" cy="400" r="3" fill="#9f67ff" opacity="0.5"/>
  <circle cx="430" cy="390" r="5" fill="#f59e0b" opacity="0.7"/>
  <circle cx="150" cy="450" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="370" cy="70" r="2" fill="#ffffff" opacity="0.4"/>
</svg>
